# =====================================================================
# Pandora — mihomo / Stash 分流配置（多设备订阅版 · v2 精简矩阵）
# 仓库：github.com/zhoukaiwh/pandora-config（公开仓库，禁止写入任何机密）
# 机场订阅地址：本文件仅留占位，请在各设备本地「覆写」中填写真实地址
# v2 设计：应用组只保留真正需要不同出口的 6 个；手动选节点统一在
#         🌐 全部节点 进行；地区组 hidden 自动运行；公共列表用锚点复用
# =====================================================================

# ---------------- 基础配置 ----------------
mixed-port: 7890
allow-lan: false  # 如需局域网共享代理改回 true（无认证，谨慎开启）
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile: {store-selected: true, store-fake-ip: true}
external-controller: 127.0.0.1:9090  # 仅本机可连；原为 0.0.0.0 且无鉴权，属安全风险
sniffer:
 enable: true
 parse-pure-ip: true
 sniff: {HTTP: {ports: [80, 8080-8880], override-destination: true}, TLS: {ports: [443, 8443], override-destination: true}, QUIC: {ports: [443, 8443], override-destination: true}}
 skip-domain: ["+.push.apple.com"]
tun: {enable: true, stack: mixed, dns-hijack: ["any:53"], auto-route: true, auto-redirect: false, auto-detect-interface: true}
skip-proxy:
 - 'localhost.weixin.qq.com'
 - 'report.url.cn'
 - '127.0.0.1'
 - '::1'

# ---------------- DNS 配置 ----------------
dns:
 enable: true
 listen: 127.0.0.1:1053  # 仅本机；如允许局域网设备用本机 DNS 改回 0.0.0.0:1053
 ipv6: false
 respect-rules: true
 enhanced-mode: fake-ip
 fake-ip-range: 198.18.0.1/16
 fake-ip-filter-mode: blacklist
 fake-ip-filter: [rule-set:fakeipfilter_domain, +.lan, +.local]
 default-nameserver: [223.5.5.5, 119.29.29.29]
 proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
 nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]

proxies:
 - {name: 🎯 直连, type: direct}

# ---------------- 代理集合 ----------------
proxy-providers:
 Airport:
  # ⚠️ 占位地址：真实订阅 URL 含机密 token，禁止提交到本仓库。
  # 请在设备端覆写（Sparkle Override / Stash 本地编辑）中填写完整订阅地址。
  url: "https://example.com/PASTE-SUBSCRIPTION-URL-ON-EACH-DEVICE"
  type: http
  interval: 86400
  filter: "(?i)(港|HK|Hong|新加|坡|狮|SG|Singapore|日本|JP|Japan|美|US|States|America)"
  # health-check 关闭：节点探测由各地区组（url-test/fallback）承担，避免重复探测
  health-check: {enable: false, url: https://www.gstatic.com/generate_204, interval: 300, timeout: 1200, expected-status: 204}
  proxy: 🎯 直连

# ---------------- 策略组 ----------------
proxy-groups:
 # 1. 应用组（仅保留需要独立出口的）
 - {name: 🤖 AI, type: select, proxies: &std [🇭🇰 香港自动, 🇸🇬 狮城自动, 🇯🇵 日本自动, 🇺🇲 美国自动, 🌐 全部节点]}
 - {name: 📲 Telegram, type: select, proxies: *std}
 - {name: 📺 流媒体, type: select, proxies: *std}
 - {name: 💶 PayPal, type: select, proxies: *std}
 - {name: 🚀 默认代理, type: select, proxies: [🇭🇰 香港自动, 🇸🇬 狮城自动, 🇯🇵 日本自动, 🇺🇲 美国自动, 🌐 全部节点, 🎯 直连]}

 # 2. 地区组（hidden 自动运行：自动组 fallback 优先高级套餐，套餐内 url-test 测速）

 # --- 🇭🇰 香港 ---
 - {name: 🇭🇰 香港自动, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, proxies: [🇭🇰 香港高级, 🇭🇰 香港标准]}
 - {name: 🇭🇰 香港标准, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(港|HK|Hong))(?=.*标准).*$", exclude-filter: "(?i)Traffic|Expire|台|日|韩|新|深|美"}
 - {name: 🇭🇰 香港高级, hidden: true, type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(港|HK|Hong))(?=.*高级).*$", exclude-filter: "(?i)Traffic|Expire|台|日|韩|新|深|美"}

 # --- 🇸🇬 狮城 ---
 - {name: 🇸🇬 狮城自动, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, proxies: [🇸🇬 狮城高级, 🇸🇬 狮城标准]}
 - {name: 🇸🇬 狮城标准, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(新加坡|坡|狮城|SG|Singapore))(?=.*标准).*$", exclude-filter: "(?i)Traffic|Expire|港|台|韩|日|美"}
 - {name: 🇸🇬 狮城高级, hidden: true, type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(新加坡|坡|狮城|SG|Singapore))(?=.*高级).*$", exclude-filter: "(?i)Traffic|Expire|港|台|韩|日|美"}

 # --- 🇯🇵 日本 ---
 - {name: 🇯🇵 日本自动, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, proxies: [🇯🇵 日本高级, 🇯🇵 日本标准]}
 - {name: 🇯🇵 日本标准, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(日|JP|Japan))(?=.*标准).*$", exclude-filter: "(?i)Traffic|Expire|港|台|韩|新|美"}
 - {name: 🇯🇵 日本高级, hidden: true, type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, timeout: 200, use: [Airport], filter: "(?i)^(?=.*(日|JP|Japan))(?=.*高级).*$", exclude-filter: "(?i)Traffic|Expire|港|台|韩|新|美"}

 # --- 🇺🇲 美国 ---
 - {name: 🇺🇲 美国自动, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 300, proxies: [🇺🇲 美国高级, 🇺🇲 美国标准]}
 - {name: 🇺🇲 美国标准, hidden: true, type: fallback, url: "https://www.gstatic.com/generate_204", interval: 300, timeout: 300, use: [Airport], filter: "(?i)^(?=.*(美|US|States|America))(?=.*标准).*$", exclude-filter: "(?i)Traffic|Expire|港|台|日|韩|新"}
 - {name: 🇺🇲 美国高级, hidden: true, type: url-test, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 20, timeout: 300, use: [Airport], filter: "(?i)^(?=.*(美|US|States|America))(?=.*高级).*$", exclude-filter: "(?i)Traffic|Expire|港|台|日|韩|新"}

 # --- 3. 全部节点（手动选节点的唯一入口）---
 - {name: 🌐 全部节点, type: select, proxies: [🎯 直连], use: [Airport], exclude-filter: "(?i)Traffic|Expire"}

# ---------------- 规则配置 ----------------
rules:
 # 1. 基础拦截与直连
 - RULE-SET,private_ip,🎯 直连,no-resolve
 - RULE-SET,private_domain,🎯 直连

 # 2. 高频应用 (AI / Social)
 - RULE-SET,ai,🤖 AI
 - RULE-SET,telegram_domain,📲 Telegram

 # 3. 流媒体（统一走 📺 流媒体 组）
 - RULE-SET,youtube_domain,📺 流媒体
 - RULE-SET,netflix_domain,📺 流媒体
 - RULE-SET,hbo_domain,📺 流媒体
 - RULE-SET,disney_domain,📺 流媒体

 # 4. 生产力与开发
 - RULE-SET,github_domain,🚀 默认代理
 - RULE-SET,cloudflare_domain,🚀 默认代理
 - RULE-SET,paypal_domain,💶 PayPal

 # 5. 生态系统
 - RULE-SET,google_domain,🚀 默认代理
 - RULE-SET,apple_cn,🎯 直连
 - RULE-SET,apple_global,🚀 默认代理
 - RULE-SET,onedrive_domain,🎯 直连
 - RULE-SET,microsoft_domain,🎯 直连
 - RULE-SET,speedtest_domain,🚀 默认代理

 # 6. IP 类规则 (DNS解析后匹配)
 - RULE-SET,telegram_ip,📲 Telegram,no-resolve
 - RULE-SET,google_ip,🚀 默认代理,no-resolve
 - RULE-SET,netflix_ip,📺 流媒体,no-resolve
 - RULE-SET,apple_ip,🎯 直连,no-resolve

 # 7. 地区与兜底
 - RULE-SET,geolocation-!cn,🚀 默认代理
 - RULE-SET,cn_domain,🎯 直连
 - RULE-SET,cn_ip,🎯 直连
 - MATCH,🚀 默认代理

# 规则集统一走 jsDelivr 国内可达镜像（testingcf 节点）。
# 若镜像失效，把下方 URL 的 https://testingcf.jsdelivr.net/gh/<用户>/<仓库>@<分支>/
# 整体换回 https://raw.githubusercontent.com/<用户>/<仓库>/<分支>/ 即可。
rule-anchor:
 ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
 domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}

rule-providers:
 fakeipfilter_domain: {!!merge <<: *domain, url: "https://testingcf.jsdelivr.net/gh/wwqgtxx/clash-rules@release/fakeip-filter.mrs"}
 private_domain: {!!merge <<: *domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"}
